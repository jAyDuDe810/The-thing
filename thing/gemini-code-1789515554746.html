<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Library</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    #menu-container {
      max-width: 800px;
      margin: 0 auto;
    }
    #search-bar {
      width: 100%;
      max-width: 400px;
      padding: 12px;
      margin-bottom: 20px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #1e1e1e;
      color: white;
      font-size: 1em;
      box-sizing: border-box;
    }
    .game-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
    }
    .game-button {
      background: #1e1e1e;
      border: 2px solid #333;
      color: #6cc27d;
      padding: 15px 25px;
      font-size: 1.1em;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
    .game-button:hover {
      background: #2a2a2a;
      border-color: #6cc27d;
    }
    #player-wrapper {
      display: none;
    }
    #player-container {
      width: 640px;
      height: 480px;
      margin: 0 auto;
      background: black;
      border-radius: 6px;
      position: relative;
    }
    #game {
      width: 100%;
      height: 100%;
    }
    #error-log {
      color: #ff5555;
      font-family: monospace;
      padding: 10px;
      margin-top: 10px;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 4px;
      text-align: left;
      font-size: 0.85em;
      max-height: 120px;
      overflow-y: auto;
      display: none;
    }
    .back-btn {
      margin-bottom: 15px;
      padding: 10px 20px;
      background: #444;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .back-btn:hover { background: #666; }
  </style>
</head>
<body>

  <div id="menu-container">
    <h2>Choose a Game</h2>
    <input type="text" id="search-bar" placeholder="Search games...">
    <div class="game-grid" id="game-list">
      <button class="game-button" data-url="https://cdn.jsdelivr.net/gh/jAyDuDe810/The-thing@57cf13c3a59632700d61895d55317650e0523bb5/thing/games/Mortal%20Kombat%20-%20Deadly%20Alliance%20(USA)%20(En%2CFr%2CDe%2CEs%2CIt).gba">Mortal Kombat: Deadly Alliance</button>
      <button class="game-button" data-url="https://cdn.jsdelivr.net/gh/jAyDuDe810/The-thing@57cf13c3a59632700d61895d55317650e0523bb5/thing/games/Mortal%20Kombat%20Advance%20(USA).gba">Mortal Kombat Advance</button>
      <button class="game-button" data-url="https://cdn.jsdelivr.net/gh/jAyDuDe810/The-thing@57cf13c3a59632700d61895d55317650e0523bb5/thing/games/Sonic%20The%20Hedgehog%20-%20Genesis%20(USA).gba">Sonic The Hedgehog (Genesis)</button>
      <button class="game-button" data-url="https://cdn.jsdelivr.net/gh/jAyDuDe810/The-thing@57cf13c3a59632700d61895d55317650e0523bb5/thing/games/Super%20Mario%20Advance%202%20-%20Super%20Mario%20World%20(USA%2C%20Australia).gba">Super Mario Advance 2</button>
      <button class="game-button" data-url="https://cdn.jsdelivr.net/gh/jAyDuDe810/The-thing@57cf13c3a59632700d61895d55317650e0523bb5/thing/games/Super%20Mario%20Advance%204%20-%20Super%20Mario%20Bros.%203%20(USA%2C%20Australia)%20(Rev%201).gba">Super Mario Advance 4</button>
    </div>
  </div>

  <div id="player-wrapper">
    <button class="back-btn" onclick="returnToMenu()">⬅ Back to Menu</button>
    <div id="player-container">
      <div id="game"></div>
    </div>
    <div id="error-log"></div>
  </div>

  <script>
    // Intercept console.error and console.warn so they print on screen
    const errorLog = document.getElementById('error-log');
    function logToScreen(type, args) {
      errorLog.style.display = 'block';
      const text = Array.from(args).map(arg => typeof arg === 'object' ? JSON.stringify(arg) : arg).join(' ');
      errorLog.innerHTML += `[${type}] ${text}<br>`;
      errorLog.scrollTop = errorLog.scrollHeight;
    }

    const originalError = console.error;
    console.error = function() {
      logToScreen('ERROR', arguments);
      originalError.apply(console, arguments);
    };

    const originalWarn = console.warn;
    console.warn = function() {
      logToScreen('WARN', arguments);
      originalWarn.apply(console, arguments);
    };

    window.addEventListener('error', function(event) {
      logToScreen('WINDOW_ERR', [event.message]);
    });

    const menuContainer = document.getElementById("menu-container");
    const playerWrapper = document.getElementById("player-wrapper");
    const searchBar = document.getElementById("search-bar");
    const gameButtons = document.querySelectorAll('.game-button');
    let activeScript = null;

    searchBar.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      gameButtons.forEach(btn => {
        btn.style.display = btn.textContent.toLowerCase().includes(term) ? 'block' : 'none';
      });
    });

    gameButtons.forEach(button => {
      button.addEventListener('click', function() {
        const gameUrl = this.getAttribute('data-url');
        
        menuContainer.style.display = 'none';
        playerWrapper.style.display = 'block';
        errorLog.style.display = 'none';
        errorLog.innerHTML = '';

        window.EJS_player = '#game';
        window.EJS_core = 'gba';
        window.EJS_gameUrl = gameUrl;
        window.EJS_pathtodata = 'https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS/data/';
        
        activeScript = document.createElement('script');
        activeScript.src = 'https://cdn.jsdelivr.net/gh/EmulatorJS/EmulatorJS/data/loader.js';
        
        activeScript.onerror = function() {
          logToScreen('FATAL', ['Loader script failed to load.']);
        };

        document.body.appendChild(activeScript);
      });
    });

    function returnToMenu() {
      if (activeScript) {
        activeScript.remove();
      }
      document.getElementById('game').innerHTML = '';
      
      playerWrapper.style.display = 'none';
      menuContainer.style.display = 'block';
      searchBar.value = '';
      gameButtons.forEach(b => b.style.display = 'block');
    }
  </script>
</body>
</html>
